<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوار</title>
<meta name="theme-color" content="#FDFAF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سوار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<script src="config.js"></script>
<style>
:root{--bg:#FDFAF5;--bg2:#F7EEE4;--text:#3F3A37;--muted:#6F6761;--gold:#C2923F;--gold-l:#E3B66D;--pink:#E2A6A4;--line:#EADFD1;
  --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
iframe{border:0;display:block;width:100%;height:100%;background:var(--bg)}

/* سوار تملأ الشاشة */
#portal{position:fixed;inset:0;padding-top:var(--top);height:100%;width:100%}
#portal iframe{height:100%}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#FFFDF9 0,var(--bg) 45%,var(--bg2) 100%);transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp img{width:min(260px,64vw);height:auto;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.bar{width:120px;height:3px;border-radius:3px;background:rgba(194,146,63,.15);overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-l),var(--pink));animation:run 1.3s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes run{0%{transform:translateX(120%)}100%{transform:translateX(-260%)}}

/* طبقة البرنامج داخل التطبيق */
#prog{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);transform:translateX(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#prog.on{transform:none}
/* البرنامج يملأ الشاشة كتطبيق: لا شريط علوي، والعودة لسوار من مقبض صغير على حافة الشاشة */
.pbar{display:none!important;flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 6px) 10px 6px;background:rgba(253,250,245,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pbtn:active{background:rgba(194,146,63,.12)}
.pbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ptitle{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{position:relative;flex:1;min-height:0;padding-top:var(--top)}
#home{position:fixed;z-index:25;left:0;top:50%;width:26px;height:68px;margin-top:-34px;border:0;padding:0;border-radius:0 18px 18px 0;
  background:linear-gradient(180deg,#16223A,#0B1222);box-shadow:0 6px 18px -6px rgba(10,15,30,.6),inset -1px 0 0 rgba(214,170,94,.55);
  display:grid;place-items:center;cursor:pointer;touch-action:none;opacity:.92;transition:width .2s,opacity .2s}
#home:active,#home.drag{width:34px;opacity:1}
#home svg{width:14px;height:14px;stroke:#E3B66D;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#home[hidden]{display:none}
[dir="ltr"] #home{left:auto;right:0;border-radius:18px 0 0 18px}
[dir="ltr"] #home svg{transform:scaleX(-1)}
/* ── شاشة فتح النظام ──
   الدائرة الذهبية تتقدّم مع مراحل الفتح الفعلية (التذكرة ← تحميل الصفحة ← جاهزية البيانات)،
   والشعار ينتقل من أيقونة النظام في سوار إلى منتصف الشاشة، والخلفية تنفتح دائرياً من موضع الضغطة */
#prog{--pc:#101A2E}
.pf{position:absolute;inset:0;visibility:hidden}
.pf.cur{visibility:visible}
.pload{position:absolute;inset:0;z-index:3;display:grid;place-items:center;overflow:hidden;color:#F4E3BF;
  --ox:50%;--oy:50%;clip-path:circle(150% at var(--ox) var(--oy));
  background:radial-gradient(70% 50% at 50% 42%,color-mix(in srgb,var(--pc) 70%,#fff 14%) 0,transparent 70%),
             linear-gradient(180deg,color-mix(in srgb,var(--pc) 82%,#000 18%),color-mix(in srgb,var(--pc) 70%,#000 30%));
  transition:opacity .38s ease}
.pload.enter{clip-path:circle(0 at var(--ox) var(--oy))}
.pload.opening{transition:clip-path .48s cubic-bezier(.3,.7,.2,1),opacity .38s ease}
.pload.out{opacity:0;pointer-events:none}
.pload.gone{display:none}
.pl-glow{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,213,142,.30),rgba(243,213,142,.08) 38%,transparent 66%);animation:plBreath 3.2s ease-in-out infinite;pointer-events:none}
.pl-sheen{position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,240,205,.07) 50%,transparent 58%);animation:plSheen 3.6s ease-in-out infinite;pointer-events:none}
@keyframes plBreath{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes plSheen{0%{transform:translateX(-30%)}100%{transform:translateX(30%)}}
.pl-core{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-4vh}
.pl-em{position:relative;width:164px;height:164px;display:grid;place-items:center;will-change:transform}
.pl-em.fly{transition:transform .5s cubic-bezier(.25,.8,.25,1)}
.pl-med{position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.20),rgba(255,255,255,.05) 60%,rgba(0,0,0,.10));
  box-shadow:inset 0 0 0 1px rgba(243,213,142,.45),inset 0 2px 0 rgba(255,255,255,.18),0 24px 50px -18px rgba(0,0,0,.6),0 0 0 6px rgba(243,213,142,.06)}
.pl-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.pl-ring circle{fill:none;stroke-width:2.2;stroke-linecap:round}
.pl-ring .trk{stroke:rgba(243,213,142,.16)}
.pl-ring .prg{stroke:url(#plGold);stroke-dasharray:502.65;stroke-dashoffset:502.65;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 0 6px rgba(243,213,142,.55))}
.pl-spin{position:absolute;inset:0;animation:plSpin 1.6s linear infinite}
.pl-spin::after{content:"";position:absolute;left:50%;top:-1px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#FFF1CC;box-shadow:0 0 10px 3px rgba(243,213,142,.8)}
@keyframes plSpin{to{transform:rotate(360deg)}}
.pload.done .pl-spin{opacity:0;transition:opacity .2s}
.picon{position:relative;z-index:1;display:grid;place-items:center;width:100%;height:100%}
.picon img{width:74%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.picon.img img{width:58%;border-radius:18px;filter:none}
.pname{font-weight:700;font-size:19px;letter-spacing:.3px;color:#F6E6C4;text-shadow:0 1px 10px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .4s .18s,transform .4s .18s}
.pload.shown .pname{opacity:1;transform:none}
.pl-err{display:none;flex-direction:column;align-items:center;gap:14px;font-size:15px;color:#F6E6C4}
.pl-err button{height:44px;padding:0 26px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:15px;color:#2B2116;background:linear-gradient(180deg,#F6DCA0,#D9AD5E);box-shadow:0 10px 24px -10px rgba(0,0,0,.6);cursor:pointer}
.pload.err .pl-err{display:flex}
.pload.err .pl-spin{display:none}
.pload.done .pl-em{transform:scale(1.06);opacity:.0;transition:transform .38s ease,opacity .38s ease}
.pload.out .pl-glow,.pload.out .pl-sheen,.pload.out .pl-spin,.pload.gone .pl-glow,.pload.gone .pl-sheen,.pload.gone .pl-spin,#splash.out .bar i{animation:none}
/* نافذة التثبيت */
#install{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:rgba(63,58,55,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:min(460px,100%);margin:0 0 calc(12px + var(--bottom));padding:24px 22px 20px;border-radius:24px;background:#FFFDF9;box-shadow:0 24px 60px rgba(63,58,55,.25);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#install{align-items:center}.sheet{margin:0}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sheet img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 20px rgba(110,98,90,.18)}
.sheet h1{margin:0;font-size:19px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.steps{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FBF6EF;font-size:14px}
.step b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#FBF0DC;color:#8C6524;font-size:12.5px}
.step svg{width:20px;height:20px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn{width:100%;height:50px;border:0;border-radius:999px;background:linear-gradient(180deg,#F0C3C1,#DE9C9A);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px -10px rgba(201,132,130,.8)}
.link{border:0;background:none;color:#A65F5D;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.err{padding:24px;text-align:center;color:var(--muted)}
/* شريط انقطاع الاتصال */
#net{position:fixed;left:50%;top:calc(var(--top) + 10px);z-index:50;transform:translate(-50%,-80px);display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;background:rgba(16,26,46,.94);color:#F6E6C4;font-size:13.5px;font-weight:600;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#net.on{transform:translate(-50%,0)}
#net i{width:8px;height:8px;border-radius:50%;background:#E2A6A4}
/* إشعارات الجوال */
#push{position:fixed;inset:0;z-index:45;display:grid;align-items:end;justify-items:center;background:rgba(43,37,34,.34);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@media (min-width:700px){#push{align-items:center}}
.pz{position:relative;width:min(440px,100%);margin:0 0 calc(10px + var(--bottom));padding:30px 24px 20px;border-radius:28px;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,#FFFEFB 0%,#FBF5EC 100%) padding-box,linear-gradient(150deg,#F6E2BA,#E3B66D 28%,#FFF6E2 52%,#D7A657 76%,#F3DDB0) border-box;border:1.5px solid transparent;
  box-shadow:0 30px 70px -20px rgba(43,37,34,.45),0 1px 0 #fff inset;animation:up .38s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.pz{margin:0}}
.pz::before{content:"";position:absolute;left:50%;top:-120px;width:340px;height:240px;margin-left:-170px;border-radius:50%;background:radial-gradient(closest-side,rgba(243,213,142,.35),transparent);pointer-events:none}
.pz-x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(63,58,55,.06);color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.pz-med{position:relative;width:92px;height:92px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#FFFFFF,#FBEFD8 60%,#F0D49E);box-shadow:inset 0 0 0 1px rgba(194,146,63,.45),inset 0 -6px 14px rgba(194,146,63,.22),0 18px 34px -16px rgba(140,101,36,.7)}
.pz-med svg{width:42px;height:42px;stroke:#A87B2F;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pz-med i{position:absolute;top:16px;inset-inline-end:16px;width:14px;height:14px;border-radius:50%;border:2px solid #FFFDF8;background:#B9B0A8}
.pz[data-st="on"] .pz-med i{background:#4E9A63;box-shadow:0 0 0 4px rgba(78,154,99,.16)}
.pz[data-st="blocked"] .pz-med i,.pz[data-st="err"] .pz-med i{background:#C0574F}
.pz[data-st="on"] .pz-med svg{animation:ring 2.4s ease-in-out 1}
@keyframes ring{0%,60%,100%{transform:none}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-5deg)}}
.pz h1{margin:0;font-size:20px;font-weight:700}
.pz-chip{display:inline-flex;align-items:center;gap:7px;height:30px;margin:10px 0 0;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:#F2EDE7;color:var(--muted)}
.pz-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pz[data-st="on"] .pz-chip{background:#E7F1E9;color:#3E6B4A}
.pz[data-st="blocked"] .pz-chip,.pz[data-st="err"] .pz-chip{background:#FBE6E3;color:#9A5A57}
.pz p{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.85}
.pz .steps{margin-top:14px}
.pz .btn{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.pz .btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pz .btn[disabled]{opacity:.7;cursor:default}
.pz .btn .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(63,58,55,.25);border-top-color:var(--text);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pz-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pz-note{margin-top:12px!important;padding:10px 14px;border-radius:14px;background:#FBF0DC;color:#8C6524!important;font-size:13px!important}
.pz-note.bad{background:#FBE6E3;color:#9A5A57!important}
.pz-note.good{background:#E7F1E9;color:#3E6B4A!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="net" role="status" aria-live="polite"><i></i><span id="netTxt"></span></div>

<div id="splash"><div class="sp"><img src="icons/logo.webp" alt="سوار"><div class="bar"><i></i></div></div></div>

<div id="portal"></div>

<div id="prog" aria-hidden="true">
  <div class="pbar">
    <button class="pbtn" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path id="backPath" d="M9 6l6 6-6 6"/></svg><span id="backTxt">رجوع</span></button>
    <div class="ptitle" id="ptitle"></div>
    <button class="pbtn" id="ext" aria-label="فتح في المتصفح" title="فتح في المتصفح"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
  </div>
  <div class="pbody" id="pbody"><div class="pload gone" id="pload"><div class="pl-glow"></div><div class="pl-sheen"></div>
    <div class="pl-core"><div class="pl-em" id="plEm"><div class="pl-med"></div>
      <svg class="pl-ring" viewBox="0 0 164 164" aria-hidden="true"><defs><linearGradient id="plGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0C8"/><stop offset=".5" stop-color="#E9BE6E"/><stop offset="1" stop-color="#B9873A"/></linearGradient></defs><circle class="trk" cx="82" cy="82" r="80"/><circle class="prg" id="plRing" cx="82" cy="82" r="80"/></svg>
      <div class="pl-spin" id="plSpin"></div><div class="picon" id="picon"></div></div>
      <div class="pname" id="pname"></div>
      <div class="pl-err"><span id="plErrTxt"></span><button id="plRetry"></button></div></div></div></div>
</div>

<button id="home" hidden aria-label="العودة إلى سوار"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>

<div id="install" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="iT">
    <img src="icons/apple-touch-icon.png" alt="">
    <h1 id="iT">تثبيت تطبيق سوار</h1>
    <div id="iBody"></div>
    <button class="link" id="iLater">لاحقاً</button>
  </div>
</div>

<div id="push" hidden>
  <div class="pz" role="dialog" aria-modal="true" aria-labelledby="pzT" id="pzCard">
    <button class="pz-x" id="pzX" aria-label="إغلاق">×</button>
    <div class="pz-med"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/></svg><i></i></div>
    <h1 id="pzT"></h1>
    <span class="pz-chip" id="pzChip"></span>
    <div id="pzBody"></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PORTAL = String(window.SIWAR_PORTAL || '');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null, progUrl = '';
  /* النظام المعروض الآن ومكانه داخله: يُحفظ في ذاكرة هذه النافذة، فإعادة التحميل تفتحه هو لا الرئيسية */
  var CURK = 'siwar_cur';
  function cleanGo(g) { g = String(g == null ? '' : g); return g.length <= 300 && !/[\s<>"'`\\]/.test(g) ? g : ''; }
  function goOfUrl(u) { var m = /[?&]go=([^&#]*)/.exec(String(u || '')); if (!m) return ''; try { return cleanGo(decodeURIComponent(m[1])); } catch (e) { return ''; } }
  function curSave(id, go) {
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(String(id || ''))) return;
    try {
      if (go == null) { var old = curLoad(); go = old && old.id === id ? old.go : ''; }
      sessionStorage.setItem(CURK, JSON.stringify({ id: id, go: cleanGo(go), at: Date.now() }));
    } catch (e) {}
  }
  function curLoad() {
    try {
      var v = JSON.parse(sessionStorage.getItem(CURK) || 'null');
      if (!v || !/^[A-Za-z0-9_-]{1,40}$/.test(String(v.id || '')) || !(Date.now() - Number(v.at) < 6 * 3600000)) return null;
      return { id: String(v.id), go: cleanGo(v.go) };
    } catch (e) { return null; }
  }
  function curClear() { try { sessionStorage.removeItem(CURK); } catch (e) {} }
  /* النصوص بلغة سوار: تصل اللغة من سوار وتُحفظ على الجهاز */
  var TXT = {
    ar: { back: 'رجوع', ext: 'فتح في المتصفح', title: 'تثبيت تطبيق سوار', later: 'لاحقاً', prog: 'برنامج', noUrl: 'لم يُضبط رابط سوار في config.js',
      desc: 'أيقونة على الشاشة الرئيسية، وتفتح الأنظمة في نافذة مستقلة.', install: 'تثبيت التطبيق',

  /* ذاكرة دائمة للأنظمة: كل نظام يحفظ نسخة شاشاته وكوده هنا (ذاكرة التطبيق تبقى بعد إغلاقه)،

  /* انقطاع الاتصال: شريط هادئ واحد، ويُبلَّغ كل نظام مفتوح */
  function netState() {

  };
  function PT(k) { return (PZT[LANG] || PZT.ar)[k]; }
  function pushApi(op, data) {
    return new Promise(function (res) {

      pzWait[rid] = res;
      toPortal({ siwar: 'pushApi', rid: rid, op: op, data: data || {} });

  // الحالة: ios (يحتاج التثبيت) · unsup · blocked · on · off
  function pushState() {

  var svgBell = '<svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/></svg>';

    else if (st === 'on') b.innerHTML = '<p>' + PT('onTxt') + '</p>' + n + pzBtn('pzTest', PT('test'), svgSend) + '<div class="pz-row"><button class="link" id="pzOff">' + PT('disable') + '</button></div>';
    else if (st === 'blocked') b.innerHTML = '<p>' + PT('blockedTxt') + '</p>' + n + pzBtn('pzRe', PT('retry'));
    else if (st === 'ios') b.innerHTML = '<p>' + PT('iosTxt') + '</p><div class="steps">' + step('1', PT('ios1')) + step('2', PT('ios2') + svgShare) + step('3', PT('ios3')) + '</div>';
    else b.innerHTML = '<p>' + PT('unsupTxt') + '</p>';
    if ($('pzOn')) $('pzOn').onclick = pushEnable;

    if ($('pzOff')) $('pzOff').onclick = pushDisable;

  function pushOpen() {

    pushState().then(function (st) { pzRender(st); });
    pzInfo = null; pushApi('info').then(function (r) { if (r.ok) pzInfo = r.data; });   // المفتاح العام جاهز قبل الضغط، فيبقى الطلب داخل لمسة المستخدم
  }

  function pushEnable() {
    pzBusy('pzOn', true);
    var infoP = pzInfo ? Promise.resolve({ ok: true, data: pzInfo }) : pushApi('info');
    var permP = Notification.permission === 'granted' ? Promise.resolve('granted') : Notification.requestPermission();
    Promise.all([permP, infoP]).then(function (a) {
      var perm = a[0], info = a[1];
      if (perm === 'denied') { pzRender('blocked'); return; }
      if (perm !== 'granted') { pzRender('off', PT('denied'), 'bad'); return; }
      if (!info.ok) { pzRender('err', pzCode(info.code), 'bad'); return; }
      if (!info.data.key) { pzRender('err', PT('nokey'), 'bad'); return; }
      return swReg().then(function (reg) {
        return reg.pushManager.getSubscription().then(function (old) {
          if (old && !sameKey(old, info.data.key)) return old.unsubscribe().then(function () { return null; });
          return old;
        }).then(function (sub) { return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(info.data.key) }); });
      }).then(function (sub) {
        return pushCfg().then(function (old) {
          var j = sub.toJSON(), dev = (iOS ? 'iPhone' : /Android/.test(ua) ? 'Android' : 'Desktop') + ' · ' + (/Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser');
          return pushApi('sub', { sub: { endpoint: j.endpoint, keys: j.keys }, device: dev }).then(function (r) {
            if (!r.ok) { pzRender('err', pzCode(r.code), 'bad'); return; }
            return pushCfgSet({ url: PORTAL, id: r.data.id, tok: r.data.tok, lang: LANG }).then(function () {
              if (old && old.id && old.id !== r.data.id) pushApi('unsub', { id: old.id });
              pzRender('on', info.data.on === false ? PT('masterOff') : info.data.allowed === false ? PT('personOff') : '', info.data.on === false || info.data.allowed === false ? '' : 'good');
            });
          });
        });
      });
    }).catch(function () { pzRender('err', PT('fail'), 'bad'); });
  }
  function pushTest() {

    pushApi('test').then(function (r) {
      var d = r.data || {};

        if (!r.ok && cfg) dropDirect(cfg);
        return swReg().then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (s2) { return s2 && s2.unsubscribe(); }).catch(function () {}).then(function () { return pushCfgSet(null); });
      });
    }).then(function () { pzRender('off'); }, function () { pzRender('off'); });
  }
  // الخروج من سوار: يُحذف اشتراك هذا الجهاز برمزه (الجلسة انتهت)، فلا تصل إشعارات الحساب السابق لمن يستخدم الجهاز بعده
  function dropDirect(cfg) { try { return fetch(cfg.url || PORTAL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'push_drop', id: cfg.id, tok: cfg.tok }) }).catch(function () {}); } catch (e) { return Promise.resolve(); } }
  function pushDropDevice() {
    pushCfg().then(function (cfg) {
      if (!cfg || !cfg.id) return;
      dropDirect(cfg);
      pushCfgSet(null);
      if (pushSupported()) swReg().then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (s2) { return s2 && s2.unsubscribe(); }).catch(function () {});
    });
  }
  // الضغط على الإشعار والتطبيق مفتوح: يُفتح النظام والصفحة فوراً بلا إعادة تحميل
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.siwar !== 'deep') return;
    var u; try { u = new URL(String(d.url || ''), location.href); } catch (x) { return; }
    var id = u.searchParams.get('open') || '', go = cleanGo(u.searchParams.get('go') || '');
    if (!portalOk || !/^[A-Za-z0-9_-]{1,40}$/.test(id)) { location.href = u.href; return; }
    $('push').hidden = true;
    if (frames[id]) dropFrame(id);
    pStart(id, 'push'); markCur(id); curSave(id, go);
    loaderShow('', null, null); showLayer();
    toPortal({ siwar: 'relaunch', id: id, go: go });
  });

  /* ── التثبيت ── */
  var svgShare = '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var svgPlus = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var svgMenu = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>';

      b.innerHTML = '<div class="steps">' +
        step('1', T('ios1')) +
        step('2', T('ios2') + svgShare) +
        step('3', T('ios3') + svgPlus) +
