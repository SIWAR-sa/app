<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوار</title>
<meta name="theme-color" content="#FDFAF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سوار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script src="config.js"></script>
<style>
:root{--bg:#FDFAF5;--bg2:#F7EEE4;--text:#3F3A37;--muted:#6F6761;--gold:#C2923F;--gold-l:#E3B66D;--pink:#E2A6A4;--line:#EADFD1;
  --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
iframe{border:0;display:block;width:100%;height:100%;background:var(--bg)}

/* البوابة تملأ الشاشة */
#portal{position:fixed;inset:0;padding-top:var(--top);height:100%;width:100%}
#portal iframe{height:100%}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#FFFDF9 0,var(--bg) 45%,var(--bg2) 100%);transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp{display:flex;flex-direction:column;align-items:center;gap:26px}
.sp img{width:min(260px,64vw);height:auto;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.bar{width:120px;height:3px;border-radius:3px;background:rgba(194,146,63,.15);overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-l),var(--pink));animation:run 1.3s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes run{0%{transform:translateX(120%)}100%{transform:translateX(-260%)}}

/* طبقة البرنامج داخل التطبيق */
#prog{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);transform:translateX(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#prog.on{transform:none}
/* البرنامج يملأ الشاشة كتطبيق: لا شريط علوي، والعودة للبوابة من مقبض صغير على حافة الشاشة */
.pbar{display:none!important;flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--top) + 6px) 10px 6px;background:rgba(253,250,245,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pbtn:active{background:rgba(194,146,63,.12)}
.pbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ptitle{flex:1;min-width:0;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{position:relative;flex:1;min-height:0;padding-top:var(--top)}
#home{position:fixed;z-index:25;left:0;top:50%;width:26px;height:68px;margin-top:-34px;border:0;padding:0;border-radius:0 18px 18px 0;
  background:linear-gradient(180deg,#16223A,#0B1222);box-shadow:0 6px 18px -6px rgba(10,15,30,.6),inset -1px 0 0 rgba(214,170,94,.55);
  display:grid;place-items:center;cursor:pointer;touch-action:none;opacity:.92;transition:width .2s,opacity .2s}
#home:active,#home.drag{width:34px;opacity:1}
#home svg{width:14px;height:14px;stroke:#E3B66D;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#home[hidden]{display:none}
[dir="ltr"] #home{left:auto;right:0;border-radius:18px 0 0 18px}
[dir="ltr"] #home svg{transform:scaleX(-1)}
/* ── شاشة فتح النظام ──
   الدائرة الذهبية تتقدّم مع مراحل الفتح الفعلية (التذكرة ← تحميل الصفحة ← جاهزية البيانات)،
   والشعار ينتقل من أيقونة النظام في البوابة إلى منتصف الشاشة، والخلفية تنفتح دائرياً من موضع الضغطة */
#prog{--pc:#101A2E}
.pf{position:absolute;inset:0;visibility:hidden}
.pf.cur{visibility:visible}
.pload{position:absolute;inset:0;z-index:3;display:grid;place-items:center;overflow:hidden;color:#F4E3BF;
  --ox:50%;--oy:50%;clip-path:circle(150% at var(--ox) var(--oy));
  background:radial-gradient(70% 50% at 50% 42%,color-mix(in srgb,var(--pc) 70%,#fff 14%) 0,transparent 70%),
             linear-gradient(180deg,color-mix(in srgb,var(--pc) 82%,#000 18%),color-mix(in srgb,var(--pc) 70%,#000 30%));
  transition:opacity .38s ease}
.pload.enter{clip-path:circle(0 at var(--ox) var(--oy))}
.pload.opening{transition:clip-path .48s cubic-bezier(.3,.7,.2,1),opacity .38s ease}
.pload.out{opacity:0;pointer-events:none}
.pload.gone{display:none}
.pl-glow{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,213,142,.30),rgba(243,213,142,.08) 38%,transparent 66%);animation:plBreath 3.2s ease-in-out infinite;pointer-events:none}
.pl-sheen{position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,240,205,.07) 50%,transparent 58%);animation:plSheen 3.6s ease-in-out infinite;pointer-events:none}
@keyframes plBreath{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes plSheen{0%{transform:translateX(-30%)}100%{transform:translateX(30%)}}
.pl-core{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-4vh}
.pl-em{position:relative;width:164px;height:164px;display:grid;place-items:center;will-change:transform}
.pl-em.fly{transition:transform .5s cubic-bezier(.25,.8,.25,1)}
.pl-med{position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.20),rgba(255,255,255,.05) 60%,rgba(0,0,0,.10));
  box-shadow:inset 0 0 0 1px rgba(243,213,142,.45),inset 0 2px 0 rgba(255,255,255,.18),0 24px 50px -18px rgba(0,0,0,.6),0 0 0 6px rgba(243,213,142,.06)}
.pl-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.pl-ring circle{fill:none;stroke-width:2.2;stroke-linecap:round}
.pl-ring .trk{stroke:rgba(243,213,142,.16)}
.pl-ring .prg{stroke:url(#plGold);stroke-dasharray:502.65;stroke-dashoffset:502.65;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 0 6px rgba(243,213,142,.55))}
.pl-spin{position:absolute;inset:0;animation:plSpin 1.6s linear infinite}
.pl-spin::after{content:"";position:absolute;left:50%;top:-1px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#FFF1CC;box-shadow:0 0 10px 3px rgba(243,213,142,.8)}
@keyframes plSpin{to{transform:rotate(360deg)}}
.pload.done .pl-spin{opacity:0;transition:opacity .2s}
.picon{position:relative;z-index:1;display:grid;place-items:center;width:100%;height:100%}
.picon img{width:74%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.picon.img img{width:58%;border-radius:18px;filter:none}
.pname{font-weight:700;font-size:19px;letter-spacing:.3px;color:#F6E6C4;text-shadow:0 1px 10px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .4s .18s,transform .4s .18s}
.pload.shown .pname{opacity:1;transform:none}
.pl-err{display:none;flex-direction:column;align-items:center;gap:14px;font-size:15px;color:#F6E6C4}
.pl-err button{height:44px;padding:0 26px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:15px;color:#2B2116;background:linear-gradient(180deg,#F6DCA0,#D9AD5E);box-shadow:0 10px 24px -10px rgba(0,0,0,.6);cursor:pointer}
.pload.err .pl-err{display:flex}
.pload.err .pl-spin{display:none}
.pload.done .pl-em{transform:scale(1.06);opacity:.0;transition:transform .38s ease,opacity .38s ease}
.pload.out .pl-glow,.pload.out .pl-sheen,.pload.out .pl-spin,.pload.gone .pl-glow,.pload.gone .pl-sheen,.pload.gone .pl-spin,#splash.out .bar i{animation:none}
/* نافذة التثبيت */
#install{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:rgba(63,58,55,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:min(460px,100%);margin:0 0 calc(12px + var(--bottom));padding:24px 22px 20px;border-radius:24px;background:#FFFDF9;box-shadow:0 24px 60px rgba(63,58,55,.25);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#install{align-items:center}.sheet{margin:0}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sheet img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 20px rgba(110,98,90,.18)}
.sheet h1{margin:0;font-size:19px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.steps{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#FBF6EF;font-size:14px}
.step b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#FBF0DC;color:#8C6524;font-size:12.5px}
.step svg{width:20px;height:20px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn{width:100%;height:50px;border:0;border-radius:999px;background:linear-gradient(180deg,#F0C3C1,#DE9C9A);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px -10px rgba(201,132,130,.8)}
.link{border:0;background:none;color:#A65F5D;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
.err{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash"><div class="sp"><img src="icons/logo.webp" alt="سوار"><div class="bar"><i></i></div></div></div>

<div id="portal"></div>

<div id="prog" aria-hidden="true">
  <div class="pbar">
    <button class="pbtn" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path id="backPath" d="M9 6l6 6-6 6"/></svg><span id="backTxt">رجوع</span></button>
    <div class="ptitle" id="ptitle"></div>
    <button class="pbtn" id="ext" aria-label="فتح في المتصفح" title="فتح في المتصفح"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
  </div>
  <div class="pbody" id="pbody"><div class="pload gone" id="pload"><div class="pl-glow"></div><div class="pl-sheen"></div>
    <div class="pl-core"><div class="pl-em" id="plEm"><div class="pl-med"></div>
      <svg class="pl-ring" viewBox="0 0 164 164" aria-hidden="true"><defs><linearGradient id="plGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0C8"/><stop offset=".5" stop-color="#E9BE6E"/><stop offset="1" stop-color="#B9873A"/></linearGradient></defs><circle class="trk" cx="82" cy="82" r="80"/><circle class="prg" id="plRing" cx="82" cy="82" r="80"/></svg>
      <div class="pl-spin" id="plSpin"></div><div class="picon" id="picon"></div></div>
      <div class="pname" id="pname"></div>
      <div class="pl-err"><span id="plErrTxt"></span><button id="plRetry"></button></div></div></div></div>
</div>

<button id="home" hidden aria-label="العودة إلى البوابة"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>

<div id="install" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="iT">
    <img src="icons/apple-touch-icon.png" alt="">
    <h1 id="iT">تثبيت تطبيق سوار</h1>
    <div id="iBody"></div>
    <button class="link" id="iLater">لاحقاً</button>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PORTAL = String(window.SIWAR_PORTAL || '');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null, progUrl = '';
  /* النصوص بلغة البوابة: تصل اللغة من البوابة وتُحفظ على الجهاز */
  var TXT = {
    ar: { back: 'رجوع', ext: 'فتح في المتصفح', title: 'تثبيت تطبيق سوار', later: 'لاحقاً', prog: 'برنامج', noUrl: 'لم يُضبط رابط البوابة في config.js',
      desc: 'أيقونة على الشاشة الرئيسية، وتفتح الأنظمة في نافذة مستقلة.', install: 'تثبيت التطبيق',
      ios1: 'افتح هذه الصفحة في متصفح Safari', ios2: 'اضغط زر المشاركة ', ios3: 'اختر «إضافة إلى الشاشة الرئيسية» ',
      an1: 'افتح هذه الصفحة في Chrome أو Edge', an2a: 'من قائمة المتصفح ', an2b: ' اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»' },
    en: { back: 'Back', ext: 'Open in browser', title: 'Install the SIWAR app', later: 'Later', prog: 'App', noUrl: 'The portal link is not set in config.js',
      desc: 'An icon on your home screen; systems open in their own window.', install: 'Install app',
      ios1: 'Open this page in Safari', ios2: 'Tap the Share button ', ios3: 'Choose “Add to Home Screen” ',
      an1: 'Open this page in Chrome or Edge', an2a: 'From the browser menu ', an2b: ' choose “Install app” or “Add to Home screen”' }
  };
  var LANG = 'ar';
  try { LANG = localStorage.getItem('siwar_lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function T(k) { return TXT[LANG][k]; }
  function applyLang(l) {
    LANG = l === 'en' ? 'en' : 'ar';
    try { localStorage.setItem('siwar_lang', LANG); } catch (e) {}
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    $('backTxt').textContent = T('back'); $('back').setAttribute('aria-label', T('back'));
    $('backPath').setAttribute('d', LANG === 'en' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6');
    $('ext').title = T('ext'); $('ext').setAttribute('aria-label', T('ext'));
    $('iT').textContent = T('title'); $('iLater').textContent = T('later');
    if (!$('install').hidden) renderInstall();
  }

  applyLang(LANG);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  /* ── البوابة ── */
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(PORTAL)) {
    $('portal').innerHTML = '<p class="err">' + T('noUrl') + '</p>';
    $('splash').className = 'out';
  } else {
    var f = document.createElement('iframe');
    f.title = 'سوار';
    f.allow = 'clipboard-read; clipboard-write; fullscreen';
    // البوابة صفحة ثابتة من نفس موقع التطبيق (portal.html): تُفتح فوراً من ذاكرة الجهاز، وتكلّم الخادم مباشرة،
    // فلا صفحة جوجل وسيطة ولا تعارض حسابات جوجل
    // رابط زر الإيميل (?open=…&go=…) يُمرَّر للبوابة لتفتح البرنامج مباشرة، ثم يُحذف من شريط العنوان
    var q = new URLSearchParams(location.search), deep = '';
    if (/^[A-Za-z0-9_-]{1,40}$/.test(q.get('open') || '')) {
      deep = '&open=' + encodeURIComponent(q.get('open'));
      var go = q.get('go') || '';
      if (go && go.length <= 300 && !/[\s<>"'`\\]/.test(go)) deep += '&go=' + encodeURIComponent(go);
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }
    f.src = 'portal.html?app=1' + deep;
    // شاشة تحميل واحدة: تبقى حتى تقول البوابة إنها جاهزة (والحد الأقصى 12 ثانية)
    f.onload = function () { setTimeout(hideSplash, 8000); };
    $('portal').appendChild(f);
    setTimeout(hideSplash, 12000);
  }

  function hideSplash() { $('splash').className = 'out'; }

  /* ── فتح البرنامج داخل التطبيق ──
     كل نظام في إطار خاص به يبقى حياً بعد العودة للبوابة (حتى MAXF أنظمة)، فالرجوع إليه فوري.
     شاشة الفتح تظهر مع الضغطة وتتقدّم مع مراحل الفتح الفعلية، وتختفي حين يقول النظام إنه جاهز. */
  var MAXF = iOS || /Android/.test(ua) ? 3 : 5, FRAME_AGE = 6 * 3600000;   // كل الأنظمة الخمسة تبقى مفتوحة على الكمبيوتر، وثلاثة على الجوال: الرجوع لنظام فُتح فوري بلا تحميل
  var frames = {}, cur = '', seq = 0;
  var RING = 502.65;
  var ERRT = { ar: { msg: 'تعذّر فتح النظام الآن.', retry: 'إعادة المحاولة' }, en: { msg: 'The system could not be opened right now.', retry: 'Try again' } };
  function portalWin() { var pf = $('portal').querySelector('iframe'); return pf && pf.contentWindow; }
  function toPortal(m) { var w = portalWin(); if (w) try { w.postMessage(m, location.origin); } catch (e) {} }
  function sendAlive() { toPortal({ siwar: 'alive', ids: Object.keys(frames) }); }
  function frameIdOf(src) {
    for (var id in frames) {
      var w = src;
      for (var k = 0; k < 6 && w; k++) {
        if (w === frames[id].f.contentWindow) return id;
        try { if (w === w.parent) break; w = w.parent; } catch (e) { break; }
      }
    }
    return '';
  }
  function setIcon(ic) {
    var box = $('picon'); box.innerHTML = ''; box.className = 'picon';
    $('prog').style.setProperty('--pc', ic && ic.kind === 'sw' && /^#[0-9a-f]{6}$/i.test(String(ic.color || '')) ? ic.color : '#101A2E');
    var img = document.createElement('img'); img.alt = '';
    if (ic && ic.kind === 'img' && /^(https:\/\/[^\s"'<>]+|data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+)$/.test(String(ic.src || ''))) { box.className = 'picon img'; img.src = ic.src; }
    else img.src = 'icons/logo.webp';
    box.appendChild(img);
  }
  function ring(p) { $('plRing').style.strokeDashoffset = String(RING * (1 - Math.max(0, Math.min(1, p)))); }
  // مرحلة الفتح: الدائرة تتقدم للمرحلة ثم تزحف ببطء نحو التالية، فلا تبدو متوقفة أثناء الانتظار
  var creepT = 0;
  function stage(p, next) {
    clearTimeout(creepT); ring(p);
    if (next) creepT = setTimeout(function () { $('plRing').style.transition = 'stroke-dashoffset 9s cubic-bezier(.1,.6,.3,1)'; ring(next); }, 1200);
  }
  function loaderShow(name, icon, rect) {
    var L = $('pload');
    $('pname').textContent = name || '';
    setIcon(icon);
    $('plRing').style.transition = 'none'; ring(0); void $('plRing').offsetWidth; $('plRing').style.transition = '';
    var ox = '50%', oy = '50%', em = $('plEm');
    em.className = 'pl-em'; em.style.transform = '';
    var pf = $('portal').querySelector('iframe'), off = pf ? pf.getBoundingClientRect().top : 0;
    if (rect && rect.w) {
      var cx = rect.x + rect.w / 2, cy = rect.y + off + rect.h / 2;
      ox = cx + 'px'; oy = cy + 'px';
    }
    L.style.setProperty('--ox', ox); L.style.setProperty('--oy', oy);
    L.className = 'pload enter';
    if (rect && rect.w) {
      // الشعار يبدأ من مكان أيقونة النظام في البوابة ثم ينتقل للمنتصف
      var r = em.getBoundingClientRect(), s = Math.max(.25, rect.w / r.width);
      em.style.transform = 'translate(' + (cx - (r.left + r.width / 2)) + 'px,' + (cy - (r.top + r.height / 2)) + 'px) scale(' + s + ')';
    }
    void L.offsetWidth;
    L.className = 'pload opening shown';
    requestAnimationFrame(function () { em.className = 'pl-em fly'; em.style.transform = ''; });
    stage(.16, .4);
  }
  function loaderDone() {
    var L = $('pload'); if (/gone|out/.test(L.className)) return;
    clearTimeout(creepT); $('plRing').style.transition = 'stroke-dashoffset .28s ease'; ring(1);
    L.className = 'pload shown done';
    setTimeout(function () { if (/done/.test(L.className)) L.className = 'pload out'; }, 260);
    setTimeout(function () { if (L.className === 'pload out') L.className = 'pload gone'; }, 700);
  }
  function loaderErr() {
    var L = $('pload'), t = ERRT[LANG] || ERRT.ar;
    clearTimeout(creepT);
    $('plErrTxt').textContent = t.msg; $('plRetry').textContent = t.retry;
    L.className = 'pload shown err';
  }
  $('plRetry').onclick = function () { if (cur) relaunch(cur, true); };

  function showLayer() {
    $('prog').className = 'on'; $('prog').setAttribute('aria-hidden', 'false'); $('home').hidden = false;
    if (!history.state || !history.state.prog) history.pushState({ prog: 1 }, '');
  }
  function markCur(id) {
    cur = id;
    for (var k in frames) frames[k].f.className = 'pf' + (k === id ? ' cur' : '');
    if (frames[id]) frames[id].seen = Date.now();
  }
  function dropFrame(id) {
    var o = frames[id]; if (!o) return;
    delete frames[id];
    clearTimeout(o.wd); clearTimeout(o.wd2);
    try { o.f.src = 'about:blank'; } catch (e) {}
    o.f.remove();
    sendAlive();
  }
  function trim(keep) {
    var ids = Object.keys(frames).filter(function (k) { return k !== keep && k !== cur; });
    while (Object.keys(frames).length > MAXF && ids.length) {
      ids.sort(function (a, b) { return (frames[a].seen || 0) - (frames[b].seen || 0); });
      dropFrame(ids.shift());
    }
  }
  // النظام سليم إذا أرسل أي إشارة من الحارس (hold أو ready أو alive). صفحة خطأ جوجل لا ترسل شيئاً
  function healthy(o) { return o.held || o.ready || o.alive; }
  function makeFrame(id, url, name, icon, warm) {
    var old = frames[id]; if (old) dropFrame(id);
    var p = document.createElement('iframe');
    p.setAttribute('credentialless', '');
    p.title = name || T('prog');
    p.allow = 'clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation';
    p.className = 'pf' + (cur === id ? ' cur' : '');
    var o = { f: p, url: url, name: name, icon: icon, t: Date.now(), seen: warm ? 0 : Date.now(), tries: old ? old.tries : 0, n: ++seq };
    frames[id] = o;
    p.onload = function () {
      if (frames[id] !== o || o.loaded) return;
      o.loaded = true;
      if (cur === id && !o.ready) stage(.7, .9);
      // بعد اكتمال الصفحة: إن لم تصل أي إشارة خلال لحظات فهي صفحة خطأ من جوجل، فيُعاد الفتح تلقائياً مرة
      o.wd2 = setTimeout(function () {
        if (frames[id] !== o || healthy(o)) return;
        if (o.tries < 1) { o.tries++; if (cur === id) relaunch(id, false); else dropFrame(id); }
        else markReady(id);   // صفحة بلا إشارة (نادر): تُعرض كما هي
      }, 1200);
    };
    // حد أقصى للانتظار
    o.wd = setTimeout(function () {
      if (frames[id] !== o || o.ready) return;
      if (!o.loaded) { if (cur === id) loaderErr(); else dropFrame(id); }
      else markReady(id);
    }, 25000);
    p.src = url;
    $('pbody').appendChild(p);
    trim(id); sendAlive();
    return o;
  }
  function markReady(id) {
    var o = frames[id]; if (!o) return;
    o.ready = true; clearTimeout(o.wd);
    if (cur === id) loaderDone();
  }

  /* أوامر البوابة */
  function onPrep(id, name, icon, rect) {
    if (frames[id]) dropFrame(id);
    markCur(id);
    loaderShow(name, icon, rect);
    showLayer();
  }
  function onOpen(id, url, name, icon) {
    if (cur !== id || $('prog').className !== 'on') { markCur(id); loaderShow(name, icon, null); showLayer(); }
    progUrl = url;
    var o = makeFrame(id, url, name, icon, false);
    markCur(id);
    stage(.42, .66);
    return o;
  }
  function onShow(id) {
    var o = frames[id];
    if (!o || Date.now() - o.t > FRAME_AGE) { if (o) dropFrame(id); toPortal({ siwar: 'relaunch', id: id }); return; }
    markCur(id);
    if (o.ready) { $('pload').className = 'pload gone'; }
    else { loaderShow(o.name, o.icon, null); stage(o.loaded ? .7 : .42, .9); }
    showLayer();
  }
  function onWarm(id, url, name, icon) { if (!frames[id]) makeFrame(id, url, name, icon, true); }
  function hideLayer(fromHistory) {
    if ($('prog').className !== 'on') return;
    $('prog').className = ''; $('prog').setAttribute('aria-hidden', 'true'); $('home').hidden = true;
    clearTimeout(creepT);
    var o = frames[cur];
    if (o && !o.ready && !o.loaded) dropFrame(cur);   // نظام لم يكتمل فتحه لا يبقى في الخلفية
    $('pload').className = 'pload gone';
    cur = '';
    for (var k in frames) frames[k].f.className = 'pf';
    if (!fromHistory && history.state && history.state.prog) history.back();
  }
  // السحب لأسفل أو F5 أو «إعادة المحاولة»: يُعاد فتح النظام بتذكرة جديدة
  var relT = 0;
  function relaunch(id, force) {
    if (!force && Date.now() - relT < 1500) return; relT = Date.now();
    var o = frames[id];
    var name = o ? o.name : $('pname').textContent, icon = o ? o.icon : null;
    if (o) dropFrame(id);
    markCur(id);
    loaderShow(name, icon, null);
    showLayer();
    toPortal({ siwar: 'relaunch', id: id });
  }

  $('back').onclick = function () { hideLayer(false); };
  // مقبض العودة: ضغطة تعيد للبوابة (والنظام يبقى حياً)، وسحبه لأعلى أو لأسفل يغيّر مكانه
  (function () {
    var h = $('home'), sy = 0, st = 0, moved = false;
    try { var y = Number(localStorage.getItem('siwar_home_y')); if (y > 0) h.style.top = y + 'px'; } catch (e) {}
    h.addEventListener('pointerdown', function (e) { sy = e.clientY; st = h.getBoundingClientRect().top + 34; moved = false; h.setPointerCapture(e.pointerId); h.classList.add('drag'); });
    h.addEventListener('pointermove', function (e) {
      if (!h.classList.contains('drag')) return;
      var d = e.clientY - sy; if (Math.abs(d) > 6) moved = true;
      if (moved) h.style.top = Math.max(80, Math.min(window.innerHeight - 80, st + d)) + 'px';
    });
    h.addEventListener('pointerup', function () {
      h.classList.remove('drag');
      if (moved) { try { localStorage.setItem('siwar_home_y', parseInt(h.style.top, 10)); } catch (e) {} }
      else hideLayer(false);
    });
  })();
  $('ext').onclick = function () { if (progUrl) window.open(progUrl, '_blank'); };
  window.addEventListener('popstate', function () { hideLayer(true); });   // زر الرجوع في الجوال

  // الرسائل تُقبل من البوابة (نفس الموقع) ومن صفحات Apps Script فقط
  window.addEventListener('message', function (e) {
    var mine = e.origin === location.origin;
    if (!mine && !/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
    var d = e.data || {}, ic = d.icon && typeof d.icon === 'object' ? d.icon : null, id = String(d.id || '');
    if (mine) {
      if (d.siwar === 'portalReady') { hideSplash(); sendAlive(); return; }
      if (d.siwar === 'prep') { onPrep(id || '_', String(d.name || ''), ic, d.rect && typeof d.rect === 'object' ? d.rect : null); return; }
      if (d.siwar === 'open' && /^https:\/\/script\.google\.com\//.test(String(d.url || ''))) { onOpen(id || '_', String(d.url), String(d.name || ''), ic); return; }
      if (d.siwar === 'show' && frames[id]) { onShow(id); return; }
      if (d.siwar === 'show') { toPortal({ siwar: 'relaunch', id: id }); return; }
      if (d.siwar === 'warm' && /^https:\/\/script\.google\.com\//.test(String(d.url || ''))) { onWarm(id, String(d.url), String(d.name || ''), ic); return; }
      if (d.siwar === 'close') { if (id && frames[id] && !frames[id].ready) dropFrame(id); hideLayer(false); return; }
      if (d.siwar === 'logout') { hideLayer(false); Object.keys(frames).forEach(dropFrame); return; }
    }
    // حفظ دخول البوابة ولغتها في صفحة التطبيق (للإصدار السابق من البوابة)
    if (d.siwar === 'storeGet') {
      var data = {};
      ['sp_token', 'sp_lang', 'sp_theme', 'sp_direct_off'].forEach(function (k) { try { var v = localStorage.getItem('pt_' + k); if (v != null) data[k] = v; } catch (x) {} });
      try { e.source.postMessage({ siwar: 'storeData', data: data }, e.origin); } catch (x) {}
      return;
    }
    if ((d.siwar === 'storeSet' || d.siwar === 'storeDel') && /^sp_(token|lang|theme|direct_off)$/.test(String(d.k || ''))) {
      try { if (d.siwar === 'storeSet') localStorage.setItem('pt_' + d.k, String(d.v).slice(0, 500)); else localStorage.removeItem('pt_' + d.k); } catch (x) {}
      return;
    }
    if (d.siwar === 'lang') { applyLang(String(d.lang || '')); return; }
    if (mine) return;
    // من النظام نفسه: نحدد أي إطار أرسل
    var fid = frameIdOf(e.source), o = frames[fid];
    if (!o) return;
    if (d.siwar === 'hold') { o.held = true; if (cur === fid && !o.ready) stage(.82, .95); }
    else if (d.siwar === 'alive') o.alive = true;
    else if (d.siwar === 'ready') markReady(fid);
    else if (d.siwar === 'close' || d.siwar === 'logout') { if (cur === fid) hideLayer(false); dropFrame(fid); }
    else if (d.siwar === 'reload' && cur === fid) relaunch(fid, false);
  });
  // F5 أو Ctrl+R على الكمبيوتر: تحديث ما على الشاشة (البوابة أو النظام المفتوح) بدل إعادة تحميل التطبيق كله
  window.addEventListener('keydown', function (e) {
    if (!(e.key === 'F5' || ((e.ctrlKey || e.metaKey) && !e.shiftKey && /^[rRق]$/.test(e.key)))) return;
    if (!portalWin()) return;
    e.preventDefault();
    if ($('prog').className === 'on' && cur) relaunch(cur, false);
    else toPortal({ siwar: 'refresh' });
  });

  /* ── التثبيت ── */
  var svgShare = '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var svgPlus = '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
  var svgMenu = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>';
  function step(n, html) { return '<div class="step"><b>' + n + '</b><span>' + html + '</span></div>'; }
  function renderInstall() {
    var b = $('iBody');
    if (deferred) {
      b.innerHTML = '<p>' + T('desc') + '</p>';
      var btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = T('install');
      btn.onclick = function () {
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; $('install').hidden = true; });
      };
      b.appendChild(btn);
    } else if (iOS) {
      b.innerHTML = '<div class="steps">' +
        step('1', T('ios1')) +
        step('2', T('ios2') + svgShare) +
        step('3', T('ios3') + svgPlus) +
        '</div>';
    } else {
      b.innerHTML = '<div class="steps">' +
        step('1', T('an1')) +
        step('2', T('an2a') + svgMenu + T('an2b')) +
        '</div>';
    }
  }
  function showInstall() { if (standalone) return; renderInstall(); $('install').hidden = false; }
  $('iLater').onclick = function () { $('install').hidden = true; };

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!$('install').hidden) renderInstall();
  });
  window.addEventListener('appinstalled', function () { $('install').hidden = true; });

  // تظهر نافذة التثبيت عند فتح الصفحة من المتصفح (لا داخل التطبيق المثبّت)
  if (!standalone) setTimeout(showInstall, /[?&]install=1/.test(location.search) ? 300 : 1800);
})();
</script>
