<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>

:root, [data-theme="identity"] {
  --bg: #F5EFE6; --surface: #FFFFFF; --surface-2: #FBF8F4; --surface-3: #F5EFE6;
  --border: #E8DFD3; --border-strong: #D9CCBC;
  --text: #3F3A37; --muted: #6F6761; --faint: #968C84;
  --gold: #E3B66D; --gold-deep: #C2923F; --pink: #E2A6A4; --pink-deep: #C98482; --pink-soft: #FBE6E3;
  --grey: #A1978F; --grey-soft: #EFEBE7; --blush: #FFEBE2;
  --primary: #E2A6A4; --primary-hover: #DA9997; --primary-text: #3F3A37;
  --focus: 0 0 0 3px rgba(226,166,164,.35);
  --radius: 0px; --radius-sm: 0px; --radius-lg: 0px; --pill: 0px;
  --shadow: none; --shadow-hover: 0 14px 34px rgba(161,151,143,.20);
  --blur: none; --inset: none;
  --card-pad: 18px;
}
[data-theme="glass"] {
  --bg: #F8EEE9; --surface: rgba(255,255,255,.56); --surface-2: rgba(255,255,255,.48); --surface-3: rgba(255,255,255,.35);
  --border: rgba(255,255,255,.78); --border-strong: rgba(226,166,164,.45);
  --radius: 18px; --radius-sm: 12px; --radius-lg: 26px; --pill: 999px;
  --shadow: 0 8px 32px rgba(161,151,143,.16); --shadow-hover: 0 20px 48px rgba(161,151,143,.28);
  --blur: blur(18px) saturate(150%);
}
[data-theme="pearl"] {
  --bg: #F1ECE8; --surface: #F1ECE8; --surface-2: #EDE7E2; --surface-3: #E9E2DC;
  --border: transparent; --border-strong: #E0D6CD;
  --radius: 22px; --radius-sm: 14px; --radius-lg: 30px; --pill: 999px;
  --shadow: 8px 8px 20px rgba(161,151,143,.30), -8px -8px 20px rgba(255,255,255,.92);
  --shadow-hover: 12px 12px 28px rgba(161,151,143,.34), -12px -12px 28px rgba(255,255,255,.96);
  --inset: inset 4px 4px 10px rgba(161,151,143,.26), inset -4px -4px 10px rgba(255,255,255,.92);
  --card-pad: 22px;
}
[data-theme="bento"] {
  --bg: #FAF7F3; --surface: #FFFFFF; --surface-2: #F7F2EC; --surface-3: #F2ECE5;
  --border: #EFE7DD; --border-strong: #E3D8CB;
  --radius: 24px; --radius-sm: 14px; --radius-lg: 32px; --pill: 999px;
  --shadow: 0 1px 2px rgba(63,58,55,.05); --shadow-hover: 0 16px 36px rgba(161,151,143,.24);
  --card-pad: 22px;
}
[data-theme="aurora"] {
  --bg: #FBF1EC; --surface: rgba(255,255,255,.62); --surface-2: rgba(255,255,255,.5); --surface-3: rgba(255,255,255,.38);
  --border: rgba(255,255,255,.85); --border-strong: rgba(226,166,164,.5);
  --radius: 28px; --radius-sm: 16px; --radius-lg: 34px; --pill: 999px;
  --shadow: 0 10px 40px rgba(226,166,164,.18); --shadow-hover: 0 24px 56px rgba(226,166,164,.32);
  --blur: blur(22px) saturate(160%);
  --card-pad: 24px;
}
[data-theme="luxe"] {
  --bg: #F2EBE1; --surface: #FFFCF7; --surface-2: #FAF5EE; --surface-3: #F4ECE2;
  --border: rgba(227,182,109,.38); --border-strong: #E6D9C6;
  --radius: 22px; --radius-sm: 14px; --radius-lg: 30px; --pill: 999px;
  --shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 0 rgba(161,151,143,.10), 0 2px 4px rgba(110,98,90,.06), 0 14px 30px -10px rgba(110,98,90,.22), 0 34px 64px -26px rgba(110,98,90,.20);
  --shadow-hover: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 0 rgba(161,151,143,.10), 0 4px 8px rgba(110,98,90,.08), 0 24px 44px -12px rgba(110,98,90,.30), 0 50px 90px -30px rgba(110,98,90,.26);
  --inset: inset 2px 3px 7px rgba(110,98,90,.14), inset -2px -2px 6px rgba(255,255,255,.95);
  --gold-rim: linear-gradient(135deg, #F6E2BA 0%, #E3B66D 22%, #FFF6E2 46%, #D7A657 70%, #F3DDB0 100%);
  --card-pad: 24px;
}
[data-theme="marble"] {
  --bg: #F6F3EF; --surface: #FFFFFF; --surface-2: #FBF9F6; --surface-3: #F3EFEA;
  --border: #ECE5DC; --border-strong: #E2D9CD;
  --radius: 20px; --radius-sm: 12px; --radius-lg: 28px; --pill: 999px;
  --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 10px 28px -14px rgba(120,105,95,.30);
  --shadow-hover: 0 1px 0 rgba(255,255,255,.9) inset, 0 22px 40px -16px rgba(120,105,95,.38);
  --card-pad: 18px;
}
[data-theme="petal"] {
  --bg: #FCF1EF; --surface: #FFFAF9; --surface-2: #FFF5F3; --surface-3: #FBE9E6;
  --border: #F6DCD8; --border-strong: #F0CFCA;
  --primary: #E9B3B1; --primary-hover: #E2A6A4;
  --radius: 999px; --radius-sm: 18px; --radius-lg: 32px; --pill: 999px;
  --shadow: 0 8px 22px -12px rgba(201,132,130,.35); --shadow-hover: 0 18px 36px -14px rgba(201,132,130,.45);
  --card-pad: 14px;
}
[data-theme="tiles"] {
  --bg: #F7F3EE; --surface: #FFFFFF; --surface-2: #FBF8F4; --surface-3: #F2ECE5;
  --border: #EFE7DD; --border-strong: #E3D8CB;
  --radius: 22px; --radius-sm: 14px; --radius-lg: 30px; --pill: 999px;
  --shadow: 0 1px 2px rgba(63,58,55,.05); --shadow-hover: 0 18px 34px -14px rgba(120,105,95,.35);
  --card-pad: 18px;
}
[data-theme="atelier"] {
  --bg: #FAF7F2; --surface: #FFFDF9; --surface-2: #FBF8F3; --surface-3: #F4EEE6;
  --border: #EADFCD; --border-strong: #E3D4BC;
  --radius: 6px; --radius-sm: 4px; --radius-lg: 8px; --pill: 999px;
  --shadow: none; --shadow-hover: none;
  --card-pad: 18px;
}
.tint-pink { --t-soft: #FBE6E3; --t-deep: #C98482; }
.tint-gold { --t-soft: #FBF0DC; --t-deep: #C2923F; }
.tint-grey { --t-soft: #EFEBE7; --t-deep: #857B74; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'Montserrat', 'Swissra', 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  transition: background-color .5s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.ltr { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
.screen { display: none; }
.screen.active { display: block; animation: screenIn .5s cubic-bezier(.2,.8,.2,1) both; }

#bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0; transition: opacity .8s ease; }
.b1 { width: 560px; height: 560px; background: #F6C9C4; top: -160px; inset-inline-start: -140px; }
.b2 { width: 520px; height: 520px; background: #F4DDAF; bottom: -180px; inset-inline-end: -120px; }
.b3 { width: 380px; height: 380px; background: #E6DED7; top: 38%; inset-inline-start: 46%; }
[data-theme="glass"] .blob { opacity: .8; }
[data-theme="aurora"] .blob { opacity: .9; animation: drift 20s ease-in-out infinite alternate; }
[data-theme="aurora"] .b2 { animation-delay: -7s; background: #F7D8A8; }
[data-theme="aurora"] .b3 { animation-delay: -13s; background: #F3C6CF; }
.gold-line { position: fixed; top: 0; inset-inline: 0; height: 3px; z-index: 60;
  background: linear-gradient(90deg, transparent, var(--gold) 20%, #F1D49C 50%, var(--gold) 80%, transparent); opacity: 0; transition: opacity .5s; }
[data-theme="identity"] .gold-line { opacity: 1; }

.surface, .card, .topbar, .tabs, .row, .modal-dialog, .toast, .menu-pop, .panel-box, .theme-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: var(--pill); font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: transform .15s ease, background-color .2s ease, box-shadow .2s ease, opacity .2s;
  border: 1px solid transparent;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, .app-card:focus-visible, .cbx:focus-visible, .tab:focus-visible, .link-btn:focus-visible, .p-item:focus-visible { outline: 2px solid #C98482; outline-offset: 2px; box-shadow: var(--focus); }
.btn-primary { background: var(--primary); color: var(--primary-text); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: var(--surface-2); border-color: var(--border-strong); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-danger { background: #F6DCDA; color: #8E4744; }
.btn-danger:hover { background: #F1CDCA; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn.loading .ic, .btn.loading span { opacity: 0; }
.btn.loading { position: relative; pointer-events: none; }
.btn.loading::after { content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--pill);
  color: var(--muted); transition: background-color .2s, color .2s, transform .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.danger:hover { background: #F6DCDA; color: #8E4744; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--pill);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip:hover { color: var(--text); }
.chip .ic { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap > .ic { position: absolute; inset-inline-start: 14px; color: var(--faint); pointer-events: none; width: 18px; height: 18px; }
.input-wrap > .icon-btn { position: absolute; inset-inline-end: 4px; width: 38px; height: 38px; }
.inp, .input-wrap input {
  width: 100%; height: 46px; padding: 0 14px; background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); box-shadow: var(--inset); transition: border-color .2s, box-shadow .2s, background-color .2s;
}
.input-wrap > .ic ~ input { padding-inline-start: 44px; }
.input-wrap > .icon-btn ~ input, .input-wrap input.has-end { padding-inline-end: 46px; }
.inp:focus, .input-wrap input:focus { outline: none; border-color: var(--pink); box-shadow: var(--focus); background: var(--surface); }
input::placeholder { color: var(--faint); }
input[dir="ltr"] { text-align: left; }
[dir="rtl"] input[dir="ltr"]::placeholder { text-align: right; }

.switch { position: relative; display: inline-block; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--grey-soft); border: 1px solid var(--border-strong); border-radius: var(--pill); transition: background-color .25s; }
.switch span::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; background: #fff; border-radius: var(--pill); box-shadow: 0 1px 3px rgba(63,58,55,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.switch input:checked + span { background: var(--pink); border-color: var(--pink); }
.switch input:checked + span::after { transform: translateX(18px); }
[dir="rtl"] .switch input:checked + span::after { transform: translateX(-18px); }
.switch input:disabled + span { opacity: .45; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: var(--pill);
  background: var(--surface-2); border: 1px solid var(--border-strong); font-size: 13px; font-weight: 600; color: var(--muted); transition: all .2s; }
.seg-btn.on { background: var(--pink-soft); border-color: var(--pink); color: var(--text); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--t-soft); border: 2px solid var(--t-deep); }

.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--pill); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge-pink { background: var(--pink-soft); color: #9A5A57; }
.badge-gold { background: #FBF0DC; color: #8C6524; }
.badge-grey { background: var(--grey-soft); color: #6F665F; }

.avatar { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--pill); flex: none;
  background: linear-gradient(135deg, var(--blush), #F8DCC0); color: #8C6524; font-weight: 700; font-size: 14px; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }

.mark { display: inline-grid; place-items: center; color: var(--gold-deep); }
.mark svg { width: 100%; height: 100%; }

#busy { position: fixed; top: 0; inset-inline: 0; height: 3px; z-index: 300; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .2s; }
#busy.on { opacity: 1; }
#busyPill { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 301; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px 0 12px; border-radius: 999px; background: rgba(16,26,46,.92); color: #F6E6C4; font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(233,190,110,.45); transform: translate(-50%, -70px); opacity: 0; transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; pointer-events: none; }
.hr-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 6px 0 4px; }
.hr-opt { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 10px 18px; border-radius: 22px; border: 1px solid var(--line, #EADFD1); background: linear-gradient(180deg, #FFFDF9, #FBF4EA); cursor: pointer; font: inherit; color: inherit; box-shadow: 0 10px 24px -16px rgba(110,80,40,.45); transition: transform .15s ease, box-shadow .15s ease; }
.hr-opt:active { transform: scale(.97); }
.hr-opt b { font-size: 16px; }
.hr-opt .app-icon { width: 72px; height: 72px; }
.hr-jisr { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(160deg, #1E3B57, #10243A); box-shadow: inset 0 0 0 1px rgba(233,190,110,.5); }
.hr-jisr svg { width: 34px; height: 34px; stroke: #F1CF86; }
.hr-alt { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
.hr-alt .link { border: 0; background: none; font: inherit; font-size: 13.5px; color: var(--muted, #6F6761); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
#busyPill.on { transform: translate(-50%, 0); opacity: 1; }
#busyPill i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(233,190,110,.22); border-top-color: #F1CF86; animation: spin .8s linear infinite; }
#busyPill:not(.on) i { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
#busy::before { content: ''; position: absolute; top: 0; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--pink), var(--gold), transparent); animation: busy 1.1s ease-in-out infinite; }

.in-app .splash:not(.boot-fail) { display: none; }
.splash { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse 70% 55% at 50% 46%, #FFFDF9 0%, #F8F1E8 48%, #EEE3D5 100%);
  transition: opacity .7s ease, visibility .7s; }
.splash::before, .splash::after { content: ''; position: absolute; left: 50%; top: 46%; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
.splash::before { width: min(620px, 120vw); aspect-ratio: 1; background: radial-gradient(circle, rgba(227,182,109,.20) 0%, rgba(227,182,109,.06) 42%, transparent 68%); animation: spGlow 4.2s ease-in-out infinite; }
.splash::after { width: min(460px, 92vw); aspect-ratio: 1; border: 1px solid rgba(194,146,63,.16); box-shadow: 0 0 0 26px rgba(255,255,255,.18), 0 0 0 27px rgba(194,146,63,.08); animation: spRing 1.4s cubic-bezier(.2,.7,.2,1) both; }
.splash.out { opacity: 0; visibility: hidden; }
.splash.out .sp-logo { transform: scale(1.06); filter: blur(2px); }
.splash-in { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 16px; text-align: center; max-width: 460px; }
.sp-logo { position: relative; width: min(300px, 66vw); aspect-ratio: 640 / 229; background: var(--sp-logo) center / contain no-repeat;
  filter: drop-shadow(0 10px 18px rgba(176,128,52,.22)); animation: spIn 1.1s cubic-bezier(.2,.7,.2,1) both; transition: transform .7s ease, filter .7s ease; }
.sp-logo::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255,250,236,.95) 50%, transparent 62%) 0 0 / 300% 100% no-repeat;
  -webkit-mask: var(--sp-logo) center / contain no-repeat; mask: var(--sp-logo) center / contain no-repeat;
  animation: spShine 2.8s ease-in-out .9s 2; }
.sp-bar { width: 132px; height: 2px; background: rgba(194,146,63,.16); overflow: hidden; border-radius: 2px; animation: spFade .8s ease .5s both; }
.sp-bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #C2923F, #F1D49C, #C2923F, transparent); animation: spBar 1.6s cubic-bezier(.45,0,.55,1) infinite; }
.splash-txt { margin: -10px 0 0; font-size: 13px; letter-spacing: .4px; color: #9A8C7E; line-height: 1.8; animation: spFade .8s ease .7s both; }
@keyframes spIn { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: drop-shadow(0 10px 18px rgba(176,128,52,.22)); } }
@keyframes spShine { 0% { background-position: 100% 0; } 55%, 100% { background-position: 0 0; } }
@keyframes spBar { from { transform: translateX(260%); } to { transform: translateX(-110%); } }
@keyframes spGlow { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
@keyframes spRing { from { opacity: 0; transform: translate(-50%, -50%) scale(.86); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes spFade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .splash::before, .sp-logo::after, .sp-bar i { animation: none; } }
.boot-err { margin: 0; padding: 12px 14px; background: #FBE6E3; color: #8E4744; font-size: 13px; line-height: 1.8; border-radius: var(--radius-sm); }
.boot-err code { display: block; margin-top: 6px; direction: ltr; text-align: left; font-family: Consolas, Menlo, monospace; font-size: 12px; word-break: break-word; }

.empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 56px 16px; color: var(--muted); text-align: center; }
.empty .ic { width: 40px; height: 40px; color: var(--faint); }

.login-top { position: absolute; top: 16px; inset-inline-end: 16px; z-index: 2; }
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 72px 16px 32px; }
.login-card { width: 100%; max-width: 400px; padding: 34px 28px 28px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
.brand-block { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 26px; text-align: center; }
.brand-logo { width: 76px; height: 76px; display: grid; place-items: center; }
.brand-logo img { max-height: 76px; width: auto; }
.brand-logo .mark { width: 64px; height: 64px; }
.portal-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
.login-card .portal-title { display: none; }

.og-col { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 176px; max-width: 250px; padding-top: 12px; }
.og-col::before { content: ''; position: absolute; top: -26px; width: 2px; height: 38px; background: #E9D7B5; }
.og-sec { position: relative; width: 100%; padding: 14px 16px 14px; border-radius: 18px; background: linear-gradient(170deg, #fff, #FFF7F0); border: 1px solid var(--border-strong); box-shadow: 0 12px 26px rgba(60,40,30,.09), inset 0 1px 0 #fff; text-align: center; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.og-sec:hover { transform: translateY(-2px); box-shadow: 0 18px 32px rgba(60,40,30,.13); }
.og-sec.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(227,182,109,.35), 0 18px 32px rgba(60,40,30,.13); }
.og-sec .t { font-size: 13px; color: var(--faint); }
.og-sec .nm { font-size: 18px; font-weight: 700; margin-top: 2px; }
.og-sec .rl { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.og-cnt { position: absolute; top: -11px; inset-inline-end: -11px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; color: #3A2A10; background: linear-gradient(145deg, #F3D49A, #D9A650); box-shadow: 0 6px 12px rgba(201,151,63,.35), inset 0 1px 0 rgba(255,255,255,.6); }
.og-mem { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 34px; }
.og-av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-size: 14px; font-weight: 700; color: #9A5A57; background: var(--pink-soft); border: 2px solid #fff; box-shadow: 0 3px 8px rgba(60,40,30,.12); }
.og-av[draggable="true"] { cursor: grab; }
.og-av.og-more { background: #F6E7C8; color: #7A5418; }
.og-none { color: var(--faint); font-weight: 400; }
.og-over { outline: 2px dashed var(--gold-deep); outline-offset: 3px; background: #FFF4E0 !important; }
body.og-dragging .og-sec, body.og-dragging .og-di { transition: none; }
.og-list { margin-top: 20px; border: 1px solid var(--border-strong); border-radius: 18px; background: linear-gradient(180deg, #FCFAF7, #F7F1EA); overflow: hidden; }
.og-mh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.7); }
.og-mh b { font-size: 16px; }
.og-mh .og-tools, .og-mh .btn { margin-inline-start: auto; }
.og-r { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(232,223,211,.7); }
.og-r:last-child { border-bottom: 0; }
.og-ri { flex: 1; min-width: 0; }
.og-rn { font-weight: 700; font-size: 15px; }
.og-rs { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.og-ra { display: flex; gap: 6px; flex: none; }
.og-src { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; vertical-align: 1px; }
.og-src-siwar { background: #FBF0DC; color: #8C6524; } .og-src-org { background: #EAF3EC; color: #3E6B4C; } .og-src-jisr { background: #E8ECF7; color: #2C3E7A; }
.og-pad { padding: 12px 16px; margin: 0; }
.og-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.og-used { margin-top: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-radius: 16px; background: linear-gradient(180deg, #FCFAF7, #F6F0E8); border: 1px solid var(--border); font-size: 14.5px; }
.og-chip { padding: 5px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--border-strong); font-size: 13.5px; }
.og-save { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.og-dirty { font-size: 13.5px; font-weight: 600; color: #8C6524; }
.og-save .btn.is-busy { opacity: .7; pointer-events: none; }
.og-empty { text-align: center; padding: 40px 24px; }
.og-empty-ic { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px; display: grid; place-items: center; color: var(--gold); background: linear-gradient(145deg, #3A332E, #211D1A); box-shadow: 0 14px 28px rgba(33,29,26,.28); }
.og-empty .savebar-actions { justify-content: center; margin-top: 14px; }
.og-pk { display: flex; flex-direction: column; gap: 6px; max-height: 52vh; overflow: auto; margin-top: 10px; }
.og-pkq { width: 100%; }
.og-pi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); text-align: start; color: var(--text); }
.og-pi:hover { background: var(--surface-2); border-color: var(--border-strong); }
.og-pi.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(227,182,109,.3); }
.og-pi b { display: block; font-size: 14.5px; } .og-pi small { display: block; font-size: 12.5px; color: var(--muted); }
.og-pi-sec { margin-inline-start: 22px; width: calc(100% - 22px); }
.og-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; background: linear-gradient(145deg, #3A332E, #211D1A); }
.og-dot.sec { background: linear-gradient(145deg, #F3D49A, #D9A650); border-radius: 50%; } .og-dot.none { background: #EFEBE7; }
.og-seed { max-height: 40vh; overflow: auto; margin: 12px 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); font-size: 14px; line-height: 1.8; }
.og-seed ul { margin: 0 18px 6px 0; padding: 0; }
@media (max-width: 720px) {
  .og { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .og-side { position: static; padding: 10px; min-width: 0; }
  .og-side h3 { display: none; }
  .og-dl { flex-direction: row; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .og-di { width: auto; flex: none; padding: 9px 12px; font-size: 14px; }
  .og-main { padding: 16px 14px; }
  .og-top h2 { font-size: 20px; }
  .og-co { margin-inline-start: 0; width: 100%; overflow-x: auto; }
  .og-head { min-width: 0; width: 100%; }
  .og-row { flex-direction: column; align-items: stretch; gap: 14px; overflow: visible; padding-inline: 0; }
  .og-col { max-width: none; min-width: 0; padding-top: 0; }
  .og-row::before, .og-col::before { display: none; }
  .og-sec { width: 100%; }
  .og-r { flex-wrap: wrap; }
  .og-ra { width: 100%; justify-content: flex-end; }
}
</style>

<section id="screen-login" class="screen">

        <label class="field"><span data-i18n="userOrEmail"></span>

        </label>

        <label class="field"><span data-i18n="userOrEmail"></span>
          <div class="input-wrap"><i data-ic="user"></i><input id="fgUser" type="email" inputmode="email" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required></div>

  // الصفحة الرئيسية من آخر جلسة فوراً، والتأكد من الخادم في الخلفية
  // إعادة تحميل التطبيق وهو داخل نظام (back=1): الرئيسية من آخر جلسة فوراً ثم يُفتح النظام نفسه مباشرة
  const snap = S.token && (!OPEN || OPEN.back) && !PAIR ? snapGet() : null;
  if (snap) {
    S.fromSnap = true;
    enterSession(snap, false);
    perfBoot('home');
    clearTimeout(slow); S.ready = true;
    setTimeout(() => $('#splash').classList.add('out'), 60);
    if (SHELL) try { window.top.postMessage({ siwar: 'portalReady' }, SHELL); } catch (e) {}
    const ti = performance.now();
    S.initP = api('init', { tix: S.inApp ? 1 : 0 });

      perfBoot('init', performance.now() - ti);
      applyConfig(d.config);
      if (d.tix && d.tix.urls) S.tix = { at: Date.now(), urls: d.tix.urls, src: 'init' };
      if (!d.session) { clearSession(); show('login'); if (d.sessionCode === 'ERR_SUSPENDED' || d.sessionCode === 'ERR_ROLE_CHANGED') loginNote(d.sessionCode); return; }
      snapSet(d.session); S.fromSnap = false;
      S.user = d.session.user; S.apps = d.session.apps || [];
      renderUserChrome(); if (S.screen === 'home') renderHome();
      if (S.user.mustChange) openChangePin(true); else { afterHome(); if (OPEN) openDeep(); }
    }).catch(c => { S.fromSnap = false; if (c !== '__handled') afterHome(); });
    return;
  }
  try {
    const ti = performance.now();
    S.initP = api('init', { tix: S.inApp ? 1 : 0 });
    const d = await S.initP;
    perfBoot('init', performance.now() - ti);
    applyConfig(d.config);
    if (d.tix && d.tix.urls) S.tix = { at: Date.now(), urls: d.tix.urls, src: 'init' };
    if (d.session) { snapSet(d.session); enterSession(d.session, false); perfBoot('home'); }
    else { clearSession(); show('login'); if (d.sessionCode === 'ERR_SUSPENDED' || d.sessionCode === 'ERR_ROLE_CHANGED') loginNote(d.sessionCode); }
  } catch (c) {
    show('login');
    const box = $('#bootErr');
    box.hidden = false;
    if (STATIC && c === 'ERR_NETWORK') {
      box.innerHTML = esc(S.lang === 'en' ? 'Could not reach the server right now.' : 'تعذّر الوصول إلى الخادم الآن.') +
        ' <a href="#" onclick="location.reload();return false" style="font-weight:700;color:inherit">' + esc(S.lang === 'en' ? 'Try again' : 'إعادة المحاولة') + '</a>';
    } else
    box.innerHTML = esc(c === 'ERR_NETWORK' ? (S.lang === 'en' ? 'Could not reach the server. If this is the first run, run setup from the Apps Script editor, approve the permissions, then deploy a new version.' : 'تعذّر الاتصال بالخادم. إذا كانت هذه أول مرة، شغّل الدالة setup من محرر Apps Script ووافق على الصلاحيات، ثم انشر نسخة جديدة.') : t(I18N.ar[c] ? c : 'ERR_SERVER')) +
      (S.lastErr ? '<code>' + esc(S.lastErr) + '</code>' : '');
  }
  clearTimeout(slow);
  S.ready = true;
  setTimeout(() => $('#splash').classList.add('out'), 150);
  if (SHELL) try { window.top.postMessage({ siwar: 'portalReady' }, SHELL); } catch (e) {}
}

async function loadPending(force) {
  if (!S.token) return;
  if (!force && S.pending && Date.now() - S.pendingAt < 180000) return;
  try {
    const pre = !force && S.pendingPre; S.pendingPre = null;
    const r = pre ? await pre : null;
    S.pending = r && r.ok ? r.data : await api('pending', { force: !!force });
    S.pendingAt = Date.now();
    renderPending();

    const g = $('#appsGrid');
    if (g && g.classList.contains('sv-enter')) setTimeout(() => { if (S.screen === 'home') renderAppsGrid(); }, 1850);
    else renderAppsGrid();
  } catch (c) { if (c !== '__handled') console.warn('pending', c); }
}
function pendingCount(appId) {

}
function renderPending() {

  if (box) return;
  const P = S.pending;
  if (!P || !P.byApp) { box.hidden = true; return; }
  let total = 0;
  const rows = [];
  S.apps.forEach(a => {
    const g = P.byApp[a.id];
    if (!g) return;
    total += g.count;
    const items = g.items.slice();

    if (g.count > items.length) { const k = items.length ? 'pendingRest' : 'pendingMore', n = items.length ? g.count - items.length : g.count; items.push({ titleAR: t(k, { n: n }), titleEN: t(k, { n: n }), go: '' }); }

    });
  });
  box.hidden = !total;
  if (!total) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="pending-head">' + esc(t('pendingTitle')) + '<span class="count">' + total + '</span></div>' + rows.join('');

const PERF = { q: [], boot: null };

}

function isMobileDev() { return /Android|iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
// تسخين الأنظمة في الخلفية: على الكمبيوتر كل الأنظمة المتاحة (حتى 5) واحداً بعد واحد، ويبدأ التالي حين يرسل السابق أول إشارة من حارسه
// (hold، لا تعتمد على رسم الشاشة لأن الإطار المخفي لا يرسم) أو بعد 15ث؛ وعلى الجوال آخر نظام فقط. يتوقف التسخين إذا فُتح نظام
let warmQ = null;
function warmLastApp() {
  if (!S.inApp || !S.token || warmQ || S.sysOn) return;
  let id = ''; try { id = localStorage.getItem('sp_last_app') || ''; } catch (e) {}
  const list = S.apps.filter(a => !a.locked && !a.jisrOnly && !S.alive[a.id]);
  list.sort((a, b) => (b.id === id ? 1 : 0) - (a.id === id ? 1 : 0));
  const todo = isMobileDev() ? (id ? list.slice(0, 1) : []) : list.slice(0, 5);
  if (!todo.length) return;
  warmQ = { todo: todo, id: '', t: 0 };
  warmStep();
}
function warmStep() {
  const q = warmQ; if (!q) return;
  clearTimeout(q.t);
  if (!S.inApp || !S.token || S.sysOn || !q.todo.length) { warmQ = null; return; }
  const app = q.todo.shift();
  if (S.alive[app.id]) return warmStep();
  const send = url => {
    if (warmQ !== q) return;
    if (!url || S.sysOn) { warmQ = null; return; }
    q.id = app.id; q.t = setTimeout(warmStep, 15000);
    try { window.top.postMessage({ siwar: 'warm', id: app.id, url: url, name: L(app, 'name'), icon: appIconMsg(app) }, '*'); } catch (e) {}
  };
  const url = takeTicket(app.id);
  if (url) send(url); else prefetchTickets(true).then(() => send(takeTicket(app.id)));
}
function warmed(id) { if (warmQ && warmQ.id === id) { clearTimeout(warmQ.t); warmQ.id = ''; warmQ.t = setTimeout(warmStep, 300); } }
function afterHome() {
  if (S.fromSnap || !S.inApp || !S.token || (S.user && S.user.mustChange)) return;
  prefetchTickets(false).then(() => setTimeout(warmLastApp, 800));
}

function uBack() { const b = U.back.pop() || { view: 'home', id: '' }; U.view = b.view; U.id = b.id; uRender(); }

const uApp = id => (U.d.apps || []).find(a => a.id === id) || { id: id, nameAR: id };
const uIcon = a => '<span class="app-icon tint-' + esc(a.tint || 'gold') + imgCls(a.icon) + '">' + iconHtml(a.icon) + '</span>';
const uReg = id => { const r = (U.d.registry || {})[id]; return r && r.d ? r.d : null; };
const uDeclared = id => { const d = uReg(id); return !!(d && (d.caps || []).length); };
const uCo = code => { const c = ((U.d.shared || {}).companies || []).find(x => x.code === code); return c ? c.nameAR : (code || ''); };
const uLeftP = p => /مستقيل|إنهاء|انهاء|منته|غادر|terminated|resigned|left/i.test(String(p.status || ''));
function uDiffN(p) {
  let n = 0;
  Object.keys(p.access || {}).forEach(k => { const e = p.access[k]; n += Object.keys(e.diff || {}).length; if (e.en && ((e.en === 'yes') !== !!e.profileOn)) n++; });
  return n;
}
function uSummary(p) {
  if (p.owner) return '<span class="u-tag u-tag-gold">المالك — كل الصلاحيات</span>';
  if (!p.profile) return '<span class="u-tag u-tag-grey">بلا وظيفة محددة</span>';
  const n = uDiffN(p);
  return n ? '<span class="u-tag u-tag-gold">' + (n === 1 ? 'مختلف في نقطة واحدة' : 'مختلف في ' + n + ' نقاط') + '</span>' : '<span class="u-tag">مثل باقي «' + esc(p.profile) + '»</span>';

function uRender() {
  navSave();

  uAfter(); uNavMark(); uBar();

function uHome() {
  const D = U.d;
  const row = (kind, txt, btn) => '<div class="u-todo-row"><span class="u-dot u-dot-' + kind + '"></span><span>' + esc(txt) + '</span>' + btn + '</div>';
  const todo = (D.todo || []).map(x => row(x.kind, x.kind === 'cover' ? 'أيام راحة متكدسة: ' + x.gaps.slice(0, 3).map(g => g.dept + ' يوم ' + U_DAYS[g.day] + ' (' + g.off + ' من ' + g.total + ')').join('، ') + (x.n > 3 ? '…' : '') : x.kind === 'left' ? x.n + ' غادروا أو أُوقفوا وحسابهم ما زال يعمل' : x.kind === 'fresh' ? x.n + ' بلا وظيفة محددة ولا صلاحيات' : x.n + ' بلا بريد إلكتروني — لا يستطيعون الدخول',
    '<button class="link-btn" data-u="showIds" data-ids="' + esc(x.ids.join(',')) + '">عرضهم</button>'));
  if (!D.people.some(p => p.source === 'jisr')) todo.unshift(row('fresh', 'بيانات الموظفين لم تُنقل من كوادر بعد', '<button class="link-btn" data-u="srcKawader">نقلها الآن</button>'));
  else if (!D.people.some(p => (p.restDays || []).length)) todo.unshift(row('fresh', 'أيام الراحة لم تُنقل من التحليلات بعد', '<button class="link-btn" data-u="srcRest">نقلها الآن</button>'));
  if (D.people.length && !D.people.some(p => p.worksFor)) todo.unshift(row('fresh', '«يعمل لـ» لم يُحدَّد للموظفين بعد', '<button class="link-btn" data-u="srcWf">تحديده الآن</button>'));

  const undeclared = D.apps.filter(a => !uReg(a.id)).length;
  if (undeclared) todo.push(row('nomail', undeclared + ' من الأنظمة لم تربط إعداداتها بسوار بعد', '<button class="link-btn" data-unav="systems">عرضها</button>'));

    '<section class="panel-box u-xl"><div><b>تعبئة جماعية من Excel</b><p class="u-muted">الوظائف، والموظفون وأيام راحتهم، والصلاحيات، والإعدادات — بقوائم منسدلة. تظهر معاينة قبل أي تغيير.</p></div><div class="savebar-actions"><button class="btn btn-ghost" data-u="xlDown">' + ic('save') + '<span>تنزيل النموذج</span></button><button class="btn btn-primary" data-u="xlUp">' + ic('upload') + '<span>رفع النموذج</span></button></div></section>';
}

function parseImport(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  const seen = {}, rows = [];
  lines.forEach((l, i) => {
    const c = l.split(/\t|;|,/).map(x => x.trim().replace(/^"|"$/g, ''));
    const email = (c[0] || '').toLowerCase();
    if (i === 0 && !/@/.test(email)) return;
    const r = { email: email, nameAR: c[1] || '', nameEN: c[2] || '' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) r.bad = 'email';
    else if (seen[email]) r.bad = 'dup';
    else if (!r.nameAR && !r.nameEN) r.bad = 'name';
    else if (S.admin.users.some(u => (u.email || '').toLowerCase() === email)) r.bad = 'exists';
    seen[email] = true;
    rows.push(r);
  });
  return rows;
}
function renderImport() {
  const rows = parseImport($('#impText').value);
  const ok = rows.filter(r => !r.bad), bad = rows.filter(r => r.bad);
  $('#impSum').innerHTML = rows.length ? '<span class="badge badge-gold">' + esc(t('importReady', { n: ok.length })) + '</span>' + (bad.length ? '<span class="badge badge-pink">' + esc(t('importBad', { n: bad.length })) + '</span>' : '') : '';
  $('#impList').innerHTML = rows.map(r => '<div class="' + (r.bad ? 'bad' : '') + '"><span class="ltr">' + esc(r.email) + '</span><span>' + esc(r.bad ? t('why_' + r.bad) : (r.nameAR || r.nameEN)) + '</span></div>').join('');
  $('#impList').hidden = !rows.length;
  $('#impGo').disabled = !ok.length;
}

const pzClone = d => ({ on: !!d.on, matrix: JSON.parse(JSON.stringify(d.matrix || {})), max: d.max, hours: d.hours });
async function pushLoad() {
  if (S.pushLoading) return; S.pushLoading = true; S.pushErr = '';
  try { const d = await api('admin_push', {}); S.push = d; S.pushDraft = pzClone(d); }
  catch (c) { S.pushErr = c === '__handled' ? '' : String(c || 'ERR_SERVER'); }
  finally { S.pushLoading = false; renderPush(); }
}
function pzIs(co, app) { const m = (S.pushDraft.matrix || {})[co] || {}; return app ? !(m.apps && m.apps[app] === false) : m.on !== false; }
function pzDirty() { return !!S.push && JSON.stringify(S.pushDraft) !== JSON.stringify(pzClone(S.push)); }
function renderPush() {
  const box = $('#pushBox'); if (!box || !S.admin) return;
  const head = (sub, sw) => '<div class="pz-head"><span class="pz-bell">' + ic('bell') + '</span><div class="pz-title"><b>إشعارات الجوال</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + (sw || '') + '</div>';
  if (!S.push) {
    box.innerHTML = head('') + (S.pushErr ? '<p class="pz-warn">' + esc(t(I18N.ar[S.pushErr] ? S.pushErr : 'ERR_SERVER')) + ' <button class="link-btn" data-act="pzReload">إعادة المحاولة</button></p>' : '<div class="u-wait"><span class="u-spin"></span><span>جارٍ التحميل…</span></div>');
    if (!S.pushErr) pushLoad(); return;
  }
  const P = S.push, d = S.pushDraft, apps = (S.admin.apps || []).filter(a => a.status === 'Active'), cos = P.companies || [];
  const sw = (on, attrs, lg) => '<button type="button" class="pz-sw' + (lg ? ' lg' : '') + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" data-act="pzToggle" ' + attrs + '></button>';
  const sub = d.on ? 'الإرسال يعمل للموظفين الذين فعّلوا الإشعارات على أجهزتهم.' : 'الإرسال متوقف لكل الموظفين.';
  const cards = cos.map(c => { const con = pzIs(c.code);
    return '<div class="pz-co' + (con ? '' : ' is-off') + '"><div class="pz-co-h"><b>' + esc(c.nameAR) + '</b><em>' + (con ? 'يعمل' : 'متوقف') + '</em>' + sw(con, 'data-co="' + esc(c.code) + '" aria-label="' + esc(c.nameAR) + '"') + '</div>' +
      apps.map(a => '<div class="pz-app"><span class="app-icon tint-' + esc(a.tint || 'gold') + imgCls(a.icon, a.shape) + '">' + iconHtml(a.icon) + '</span><span class="nm">' + esc(a.nameAR) + '</span>' +
        sw(pzIs(c.code, a.id), 'data-co="' + esc(c.code) + '" data-app="' + esc(a.id) + '" aria-label="' + esc(c.nameAR + ' · ' + a.nameAR) + '"' + (con ? '' : ' disabled')) + '</div>').join('') + '</div>'; }).join('');
  box.classList.toggle('is-off', !d.on);
  box.innerHTML = head(sub, sw(d.on, 'data-co="*" aria-label="إشعارات الجوال"', true)) +
    (P.ready ? '' : '<p class="pz-warn">الإرسال لم يُهيأ بعد على الخادم؛ يعمل بعد تشغيل pushSetup مرة واحدة من محرر Apps Script.</p>') +
    '<div class="pz-stats"><span class="pz-chip"><b>' + P.devices + '</b> جهاز مفعّل</span><span class="pz-chip"><b>' + P.people + '</b> موظف</span></div>' +
    '<div class="pz-cos">' + cards + '</div>' +
    '<div class="pz-nums"><label class="pz-num"><span>الحد لكل موظف في الساعة</span><input class="inp" type="number" inputmode="numeric" min="1" max="60" id="pzMax" value="' + esc(d.max) + '"></label>' +
    '<label class="pz-num"><span>يبقى الإشعار صالحاً (ساعة)</span><input class="inp" type="number" inputmode="numeric" min="1" max="72" id="pzHours" value="' + esc(d.hours) + '"></label></div>' +
    '<div class="pz-foot"><span class="u-muted" id="pzState">' + (pzDirty() ? 'تعديلات لم تُحفظ' : '') + '</span><button type="button" class="btn btn-primary" data-act="pzSave" id="pzSaveBtn"' + (pzDirty() ? '' : ' disabled') + '>' + ic('save') + '<span>حفظ</span></button></div>';
  if (!box.dataset.bound) { box.dataset.bound = '1'; box.addEventListener('input', e => { if (!S.pushDraft) return; if (e.target.id === 'pzMax') S.pushDraft.max = e.target.value; else if (e.target.id === 'pzHours') S.pushDraft.hours = e.target.value; else return; pzMarkDirty(); }); }
}
function pzMarkDirty() { const on = pzDirty(); const b = $('#pzSaveBtn'), st = $('#pzState'); if (b) b.disabled = !on; if (st) st.textContent = on ? 'تعديلات لم تُحفظ' : ''; }
function pzToggle(el) {
  const d = S.pushDraft; if (!d) return;
  const co = el.dataset.co, app = el.dataset.app;
  if (co === '*') d.on = !d.on;
  else { const m = d.matrix[co] = d.matrix[co] || { on: true, apps: {} }; m.apps = m.apps || {};
    if (app) m.apps[app] = !pzIs(co, app); else m.on = !pzIs(co); }
  renderPush();
}
async function pzSave(btn) {
  const d = S.pushDraft, max = Math.round(Number(d.max)), hours = Math.round(Number(d.hours));
  const bad = !(max >= 1 && max <= 60) ? 'الحد لكل موظف في الساعة: من 1 إلى 60.' : !(hours >= 1 && hours <= 72) ? 'مدة صلاحية الإشعار: من 1 إلى 72 ساعة.' : '';
  const fail = msg => openModal({ title: ic('info') + '<span>لم تُحفظ إعدادات الإشعارات</span>', body: '<p>' + esc(msg) + '</p><p class="u-muted">تعديلاتك ما زالت في الصفحة.</p>', foot: '<button class="btn btn-primary" data-act="closeModal">' + ic('check') + '<span>حسناً</span></button>' });
  if (bad) return fail(bad);
  setLoading(btn, true);
  try { const r = await api('admin_savePush', { on: !!d.on, matrix: d.matrix, max: max, hours: hours }); S.push = r; S.pushDraft = pzClone(r); renderPush(); toast('حُفظت إعدادات الإشعارات', 'ok'); }
  catch (c) { if (c !== '__handled') fail(c === 'ERR_NETWORK' ? 'تعذّر الاتصال بالخادم. لم يُحفظ شيء؛ اضغط «حفظ» مرة أخرى.' : t(I18N.ar[c] ? c : 'ERR_SERVER')); }
  finally { setLoading($('#pzSaveBtn'), false); pzMarkDirty(); }
}

function processImage(file, kind) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) return reject('ERR_IMG');
    const reader = new FileReader();
    reader.onerror = () => reject('ERR_IMG');
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject('ERR_IMG');
      img.onload = () => {
        const w0 = img.naturalWidth || 512, h0 = img.naturalHeight || 512;
        const attempt = size => {
          const c = document.createElement('canvas');
          const r = Math.min(1, size / Math.max(w0, h0));
          c.width = Math.max(1, Math.round(w0 * r)); c.height = Math.max(1, Math.round(h0 * r));
          const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, c.width, c.height);
          let out = c.toDataURL('image/png');
          if (out.length > 44000) { const webp = c.toDataURL('image/webp', 0.9); if (webp.indexOf('data:image/webp') === 0 && webp.length < out.length) out = webp; }
          return out;
        };
        let size = kind === 'icon' ? 320 : 360, out = attempt(size);
        while (out.length > 44000 && size > 64) { size = Math.round(size * 0.8); out = attempt(size); }
        if (out.length > 44000) return reject('ERR_IMG');
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let modalLocked = false, confirmResolve = null;

function openModal(o) {
  const m = $('#modal');
  modalLocked = !!o.locked;
  $('#modalX').hidden = modalLocked;
  $('#modalTitle').innerHTML = o.title || '';
  $('#modalBody').innerHTML = o.body || '';
  $('#modalFoot').innerHTML = o.foot || '';
  $('#modalFoot').hidden = !o.foot;
  m.classList.toggle('wide', !!o.wide);
  m.classList.add('open');
  m.setAttribute('aria-hidden', 'false');
  if (!m.classList.contains('was-open')) S.lastFocus = document.activeElement;
  m.classList.add('was-open');
  const first = $('#modalBody input:not([readonly])');
  setTimeout(() => {
    if (first && window.innerWidth > 720) first.focus();
    else { const f = $('.modal-dialog', m); f.setAttribute('tabindex', '-1'); f.focus({ preventScroll: true }); }
  }, 80);
}

function trapFocus(e) {
  const m = $('#modal');
  if (e.key !== 'Tab' || !m.classList.contains('open')) return;
  const els = $$('.modal-dialog button:not([disabled]):not([hidden]), .modal-dialog input:not([disabled]):not([type="hidden"]), .modal-dialog select, .modal-dialog textarea, .modal-dialog a[href]', m).filter(x => x.offsetParent !== null);
  if (!els.length) return;
  const a = els[0], z = els[els.length - 1];
  if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
}
function closeModal(force) {
  if (modalLocked && force !== true) return;
  modalLocked = false;
  const m = $('#modal');
  m.classList.remove('open', 'was-open');
  m.setAttribute('aria-hidden', 'true');
  if (S.lastFocus && S.lastFocus.focus && document.contains(S.lastFocus)) { try { S.lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  S.lastFocus = null;
  if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(false); }
}
function confirmBox(msg, danger) {
  return new Promise(resolve => {
    openModal({
      title: ic(danger ? 'trash' : 'alert') + esc(t('confirm')),
      body: '<p style="margin:0">' + esc(msg) + '</p>',
      foot: '<button class="btn btn-ghost" data-act="closeModal">' + esc(t('cancel')) + '</button><button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-act="confirmYes">' + ic(danger ? 'trash' : 'check') + '<span>' + esc(t(danger ? 'delete' : 'confirm')) + '</span></button>'
    });
    confirmResolve = resolve;
  });
}

function toast(msg, type) {
  type = type || 'ok';
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast t-' + type;
  el.innerHTML = '<span class="t-ic">' + ic(type === 'ok' ? 'checkCircle' : type === 'err' ? 'alert' : 'info') + '</span><span>' + esc(msg) + '</span><span class="t-bar"></span>';
  box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  const kill = () => { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => el.remove(), 350); };
  const timer = type === 'err' ? 0 : setTimeout(kill, 3800);
  if (type === 'err') { el.classList.add('t-stay'); el.title = S.lang === 'en' ? 'Tap to close' : 'اضغط للإغلاق'; }
  el.addEventListener('click', () => { clearTimeout(timer); kill(); });
}

function closeMenu() { $('#userMenu').classList.remove('open'); }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  toast(t('ok_copied'), 'ok');
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!$('#userMenu').contains(e.target)) closeMenu();
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    if (e.target.matches && e.target.matches('input[type="file"][data-upload]')) { onUpload(e.target); return; }
    const el = e.target.closest('[data-change]');
    if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) closeModal(); closeMenu(); }
    trapFocus(e);
  });
  document.addEventListener('error', e => {
    const img = e.target;
    if (img && img.tagName === 'IMG' && img.closest('.app-icon')) img.outerHTML = glyph('grid');
    else if (img && img.tagName === 'IMG' && img.closest('#loginLogo, #tbBrand')) img.outerHTML = '<span class="mark">' + glyph('portal') + '</span>';
  }, true);
  $('#vLogin').addEventListener('submit', onLogin);
  $('#vForgot').addEventListener('submit', onForgot);
  $('#vReset').addEventListener('submit', onReset);
  $('#settingsForm').addEventListener('submit', saveSettings);
  $('#sLogo').addEventListener('input', () => { $('#sLogoData').value = ''; $('#sLogo').placeholder = 'https://'; renderLogoPrev(); });
  $('#appSearch').addEventListener('input', deb(renderAppsGrid));
  $('#fltApps').addEventListener('input', deb(() => S.admin && renderAdminApps()));
  $('#fltUsers').addEventListener('input', deb(() => S.admin && renderAdminUsers()));
  $('#fltAccess').addEventListener('input', deb(() => S.admin && filterAccess()));
  $('#fltLogs').addEventListener('input', deb(() => S.admin && renderLogs()));
  $('#rsCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
}

function bindTilt() {
  const fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine || calm) return;
  let current = null;
  const reset = el => { if (el) { el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); } };
  document.addEventListener('pointermove', e => {
    if (document.documentElement.dataset.theme !== 'luxe') return;
    const card = e.target.closest ? e.target.closest('.app-card') : null;
    if (card !== current) { reset(current); current = card; }
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.setProperty('--rx', ((0.5 - y) * 7).toFixed(2) + 'deg');
    card.style.setProperty('--ry', ((x - 0.5) * 5).toFixed(2) + 'deg');
    card.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  }, { passive: true });
  document.addEventListener('pointerleave', () => { reset(current); current = null; });
}
